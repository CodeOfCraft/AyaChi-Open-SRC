name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        run: msbuild Ayachi/Ayachi.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayachi-x64-Release
          path: |
            Ayachi/x64/Release/Ayachi.dll
            Ayachi/x64/Release/Ayachi.pdb
          if-no-files-found: error
